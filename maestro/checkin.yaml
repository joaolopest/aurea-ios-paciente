appId: com.zenixcode.aurea.paciente
---
- launchApp
- extendedWaitUntil:
    visible: "Começar|Continuar de onde parei"
    timeout: 15000
- takeScreenshot: maestro/shots/03b-hoje-estado
- tapOn: "Começar|Continuar de onde parei"
- runFlow:
    when:
      visible: "Qual foi a temperatura mais alta que você mediu?"
    commands:
      - takeScreenshot: maestro/shots/03c-retomou-na-temperatura
      - tapOn: "Voltar"
- extendedWaitUntil:
    visible: "Você teve febre?"
    timeout: 10000
- takeScreenshot: maestro/shots/04-pergunta
- tapOn: "Sim"
- extendedWaitUntil:
    visible: "Qual foi a temperatura mais alta que você mediu?"
    timeout: 5000
- inputText: "38,2"
- takeScreenshot: maestro/shots/05-temperatura
- tapOn: "Voltar"
- extendedWaitUntil:
    visible: "Você teve febre?"
    timeout: 5000
- takeScreenshot: maestro/shots/06-voltou-com-sim-marcado
- tapOn: "Não"
- extendedWaitUntil:
    visible: "Você teve diarreia?"
    timeout: 5000
- tapOn: "Não"
- extendedWaitUntil:
    visible: "Você sentiu enjoo?"
    timeout: 5000
- tapOn: "Não"
- extendedWaitUntil:
    visible: "Você sentiu dor?"
    timeout: 5000
- tapOn: "Sim"
- extendedWaitUntil:
    visible: "Onde dói?"
    timeout: 5000
- takeScreenshot: maestro/shots/07-opcoes
- tapOn: "Voltar"
- tapOn: "Não"
- extendedWaitUntil:
    visible: "Você sentiu falta de ar?"
    timeout: 5000
- tapOn: "Não"
- extendedWaitUntil:
    visible: "Que bom que você respondeu hoje."
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: maestro/shots/08-fechamento
- tapOn: "Voltar para o início"
- extendedWaitUntil:
    visible: "Suas respostas de hoje chegaram à equipe."
    timeout: 5000
- takeScreenshot: maestro/shots/09-hoje-respondido
