name: AureaPaciente
options:
  bundleIdPrefix: com.zenixcode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F5LL752895
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
configs:
  Debug: debug
  Release: release
targets:
  AureaPaciente:
    type: application
    platform: iOS
    sources:
      - path: AureaPaciente
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: AureaPaciente/Info.plist
      properties:
        # Nome da tela inicial. "AUREA Paciente" ao lado do "AUREA" da equipe: dois apps, mesma família.
        CFBundleDisplayName: AUREA Paciente
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A tela de abertura é o papel liso: emenda com a primeira tela sem logo girando (DCM §Checklist).
        UILaunchScreen:
          UIColorName: Papel
        ITSAppUsesNonExemptEncryption: false
        # Nunito (SIL OFL 1.1, Resources/Fontes/OFL.txt): a letra redonda e macia da prévia
        # aprovada. Instâncias estáticas geradas do arquivo variável do google/fonts.
        UIAppFonts:
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.zenixcode.aurea.paciente
            CFBundleURLSchemes: [aurea]
        # Só a API local de desenvolvimento fala HTTP. Produção é HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        EnderecoDaAPI: $(ENDERECO_DA_API)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenixcode.aurea.paciente
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # O script de conformidade lê TODOS os .swift do app. Com a sandbox de scripts,
        # cada arquivo teria de ser declarado como entrada — e arquivo novo esquecido na
        # lista passaria sem verificação, que é o furo que o web teve (ADR-006).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # A lei 1 é verificada no build: se aparecer token de risco ou campo de classificação
    # no código do app, o build falha (docs/BRIEFING-E-DCM.md §2).
    preBuildScripts:
      - name: Conformidade clínica (lei 1)
        script: '"${SRCROOT}/scripts/conformidade.sh"'
        basedOnDependencyAnalysis: false
  AureaPacienteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AureaPacienteTests
    dependencies:
      - target: AureaPaciente
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zenixcode.aurea.paciente.testes
schemes:
  AureaPaciente:
    build:
      targets:
        AureaPaciente: all
        AureaPacienteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AureaPacienteTests]
